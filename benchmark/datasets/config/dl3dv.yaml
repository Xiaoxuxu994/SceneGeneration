sampling:
  split: "test"   # train | val | test
  mode: "stride"  # str, stride or random
  stride: 5       # frame interval, only for stride mode
  seed: 42        # random seed, only for random mode
  seq_len: 8      # number of views in sampled sequence
  max_seq_len: -1 # total maximum length of the original clip, -1 to use all
  num_seq: 100    # number of sequences to be evaluated
  seq: ""         # e.g. chess/seq-01 ; empty means all

depth:
  vmin: 0.1
  vmax: 10.0