## Image file format
image_format: .jpg
## Depth range lower bound
depth_lowerbound: 0.001
## Depth range upper bound
depth_upperbound: 65535.0
## Length of data clip
clip_length: 32
## Interval of frame sampling
samp_interval: 1
## Minimal views to sample for a batch
sample_min: 16
## Maximum views to sample for a batch
sample_max: 16

depth_is_z: true

pred_z_depth: false

overlap_thre_synth: 0.08
overlap_thre_real: 0.20

crop_lowerbound: 0.0
crop_upperbound: 0.15