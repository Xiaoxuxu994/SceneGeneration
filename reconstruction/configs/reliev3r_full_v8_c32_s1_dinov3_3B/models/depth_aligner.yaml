# Tokenizer information
type: pi3 # Optional from [ours, pi3]
ours:
  tokenizer:

    integrate_tokenizer:
      enabled: false
      type: linear
      d_in: 10
      d_token: 512
      patch_size: 14

    image_tokenizer:
      enabled: true
      type: dinov2_small
      d_in: 3
      d_token: 384
      # patch_size: 14
      ckpt_path: ./ckpt/dinov2-small

    depth_tokenizer:
      enabled: false
      type: linear
      d_in: 1 # use depth feature from depth model directly.
      d_token: 96
      patch_size: 14

    camera_tokenizer:
      enabled: false
      type: linear
      d_in: 6
      d_token: 512
      patch_size: 14

  de_tokenizer:
    type: dpt # optional from [dpt, linear]

  depth_scaler:
    enabled: false

  d_model: 512
  transformer_layer_count: 12
  n_heads: 16
  patch_size: 14

pi3:
  pos_type: rope100
  model_size: dinov3_huge+_3.00B
  # model_size: dinov2_large_0.95B
  depth_scaler:
    enabled: false
  point_head:
    enabled: false
  depth_head:
    enabled: true
  pred_z_depth: false
  enable_camera_register: true

depth_scaler:
  enabled: false