iterations: 130000
batch_size: 2
ckpt_interval: 5000
verbose_interval: 1000
warm_up_iterations: 2000
eval_interval: 50
learning_rate: 0.00005
lr_scheduler: "cosine"

optimizer:
  type: AdamW

dataset_schedule:
  stage1: # full pi3 + svLoss
    step_begin: 0
  stage2: # full pi3 + svLoss + nvLoss
    step_begin: 100
  stage3: # mix pi3 + svLoss + nvLoss / reliev3r + nvLoss
    step_begin: 200
