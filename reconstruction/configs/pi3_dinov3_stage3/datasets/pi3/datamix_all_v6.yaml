# @package _global_

train:
    num_workers: 4
    num_resolution: -1
    random_reslution: true
    image_num_range: [2, 16]
    max_img_per_gpu: 16
    aspect_ratio_range: [0.5, 2.0]
    pixel_count_range: [100000, 173000]
    patch_size: 16 #14 for dinov2 # 16 for dinov3
    base_seed: 666

test:
