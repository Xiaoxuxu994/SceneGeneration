# @package _global_
# Shared training recipe for the ScanNet++-only loop-transformer ablation (exp1022_00 .. exp1022_05).
# Every run uses exactly this file; only the model config differs.
#
# Budget (16 NPUs): fixed 8 views, 16 samples (128 images) / NPU -> 2048 images / step;
# 30 epochs x 500 steps = 15k steps ~= 31M image samples. 32 samples / NPU ran out of memory in the
# full Pi3 loss (dense per-pixel tensors at 432x592); the model alone is ~16.5 GiB at 128 images and
# ~5.1-5.3 s/step compute on 910B3 with checkpointing. OneCycle: 5% warmup, cosine decay;
# decoder/heads lr 1e-4, DINOv3 encoder lr 1e-5.

trainer: trainers.pi3_trainer.Pi3Trainer

train:
  image_num_range: [8, 8]       # fixed 8 views per sample
  max_img_per_gpu: 128          # 16 samples x 8 views per NPU (256 OOMs in the loss)

  random_reslution: true
  aspect_ratio_range: [0.5, 2.0]
  pixel_count_range: [100000, 255000]
  patch_size: 16                # DINOv3
  num_resolution: -1
  width_range: [400, 600]

  num_epoch: 30
  iters_per_epoch: 500
  print_freq: 20
  num_workers: 4

  optimizer:
    lr: 1e-4
    encoder_lr: 1e-5
  lr_scheduler:
    pct_start: 0.05
    div_factor: 25
    final_div_factor: 100

test:
  num_workers: 4
  max_img_per_gpu: 8            # 1 sample (8 views) per test batch: metrics are computed on batch element 0
  iters_per_test: 125           # 125 x 16 NPUs = all 2000 held-out clips (fixed set), once per epoch

# NOTE: log.* is set on the command line in run_sh_s3/run_scannetpp/common.sh, because configs/general
# (which defines log.ckpt_interval) is composed after this file and would override it.

model:
  ckpt: null
