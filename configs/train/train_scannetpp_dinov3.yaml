# @package _global_
# Shared training recipe for the ScanNet++-only loop-transformer ablation (exp1022_00 .. exp1022_04).
# Every run uses exactly this file; only the model config differs.
#
# Budget (16 NPUs): fixed 8 views, 32 samples (256 images) / NPU -> 4096 images / step;
# 15 epochs x 500 steps = 7.5k steps ~= 31M image samples. Measured on 910B3 with checkpointing:
# ~10.4 s/step compute, ~32 GiB peak at 432x592. OneCycle: 5% warmup, cosine decay;
# decoder/heads lr 1e-4, DINOv3 encoder lr 1e-5.

trainer: trainers.pi3_trainer.Pi3Trainer

train:
  image_num_range: [8, 8]       # fixed 8 views per sample
  max_img_per_gpu: 256          # 32 samples x 8 views per NPU

  random_reslution: true
  aspect_ratio_range: [0.5, 2.0]
  pixel_count_range: [100000, 255000]
  patch_size: 16                # DINOv3
  num_resolution: -1
  width_range: [400, 600]

  num_epoch: 15
  iters_per_epoch: 500
  print_freq: 20
  num_workers: 4

  optimizer:
    lr: 1e-4
    encoder_lr: 1e-5
  lr_scheduler:
    pct_start: 0.05
    div_factor: 25
    final_div_factor: 100

test:
  num_workers: 4
  max_img_per_gpu: 8            # 1 sample (8 views) per test batch: metrics are computed on batch element 0
  iters_per_test: 125           # 125 x 16 NPUs = all 2000 held-out clips (fixed set), once per epoch

# NOTE: log.* is set on the command line in run_sh_s3/run_scannetpp/common.sh, because configs/general
# (which defines log.ckpt_interval) is composed after this file and would override it.

model:
  ckpt: null
