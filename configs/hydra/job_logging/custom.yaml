# @package hydra.job_logging
# python logging configuration for tasks
version: 1
# work_dir: /efs-mi-east4-2/z00533370/proj_3dgs/3drecon/
work_dir: /efs-m3ga/c50041401/exp/pi3sup/
formatters:
  simple:
    format: '%(message)s'
  detailed:
    format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: detailed
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    formatter: detailed
    # filename: ${work_dir}/outputs/${name}-${now:%Y-%m-%d_%H-%M-%S}/log.log
    filename: ${work_dir}/outputs/${name}/log.log
root:
  level: INFO
  handlers: [console, file]

disable_existing_loggers: False