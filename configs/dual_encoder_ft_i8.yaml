inference:
  compute_metrics: false
  if_inference: false
  render_video: false
  render_video_config:
    loop_video: true
    num_frames: 60
    order_poses: false
    traj_type: interpolate
  view_idx_file_path: ./data/scannetpp/evaluation_index_scannetpp_i32_t32.json
model:
  class_name: model.LVSM_scene_dual_encoder.Images2LatentScene
  image_tokenizer:
    image_size: 256
    in_channels: 9
    patch_size: 8
  target_pose_tokenizer:
    image_size: 256
    in_channels: 6
    patch_size: 8
  transformer:
    d: 768
    d_head: 64
    decoder_n_layer: 12
    depth_init: true
    encoder_n_layer: 12
    n_latent_vectors: 3072
    special_init: true
    use_qk_norm: true
training:
  allowed_gradnorm_factor: 20
  amp_dtype: bf16
  batch_size_per_gpu: 2
  beta1: 0.9
  beta2: 0.95
  center_crop: true
  checkpoint_dir: /storage/home/nargenziano/LVSM/checkpoints/LVSM_scene_dual_encoder_ftDecTok_lr25e-7_i8_all_ft
  checkpoint_every: 2000
  dataset_name: data.dataset_scene_dual.Dataset
  dataset_path: /storage/datasets/nargenziano/re10k_LVSM/train/re10k_scannetpp.txt
  freeze_decoder: false
  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0
  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  lr: 2.5e-06
  mlflow_exp_name: dual_encoder_ft_i8
  mlflow_log_every: 50
  mlflow_project: LVSM_all
  mlfow_tracking_uri: /storage/home/nargenziano/mlruns
  num_input_views: 8
  num_target_views: 6
  num_threads: 8
  num_views: 14
  num_workers: 4
  perceptual_loss_weight: 0.5
  prefetch_factor: 32
  print_every: 10
  reset_training_state: false
  scene_scale_factor: 1.35
  square_crop: true
  target_has_input: true
  train_steps: 100000
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 192
    min_frame_dist: 25
  vis_every: 1000
  warmup: 3000
  weight_decay: 0.05
