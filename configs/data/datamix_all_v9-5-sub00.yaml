# @package _global_
# datamix_all_v9-5-sub00：v9-5 在贵阳 OBS 上现有的子集，用于先起训练看耗时；数据补全后再出 sub01 / 全量。
# 与 datamix_all_v9-5 相比：
#   - 数据集参数、各数据集权重、dataloader 设置完全相同，不开任何过滤开关（与原始训练一致）；
#   - 去掉 ARKitScenes、DL3DV、Objaverse（贵阳 OBS 上还没有 / 没复制完），其余 23 个，train 权重合计 69400；
#   - ScanNet 用新路径 obs://bucket-471/z00533370/dataset/scannet_v2_decode；
#   - 每个数据集加 path_remap（efs 前缀 -> 贵阳 OBS）与 cache_dir。data_root 仍是 efs 路径（缓存文件名按它的哈希命名）。
# cache_dir 默认读 OBS 上的 dataset_cache；设了环境变量 DATASET_CACHE_DIR 时改读那里
#（训练脚本会先把需要的缓存拷到节点本地盘 /cache/dataset_cache，避免 8 个进程同时从 OBS 拉几 GB 的 pkl）。
