# @package _global_
# ScanNet++ (DSLR, reliev3r preprocessing) only, for the loop-transformer study.
# Scene-level split: first 90% of scenes (sorted) -> train, last 10% -> held-out test.
# Train-side sampling params are identical to datamix_all_v10-1; train and test share split_ratio.

train_dataset:
    length: 10000000         # dummy

    weights:
        Scannetpp: 1

    Scannetpp:
        _target_: datasets.scannetpp_dataset.ScannetppDataset
        data_root: /efs-m3ga/z00533370/reliev3r_data/scannetpp
        split_ratio: 0.9
        max_distance: 20
        random_sample_thres: 0.05
        stride_sample_thres: 0.50
        stride_candidates: [5, 10, 15, 25]
        force_global_sampling: false
        z_far: 40
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights:
        Scannetpp: 2000

    Scannetpp:
        _target_: datasets.scannetpp_dataset.ScannetppDataset
        data_root: /efs-m3ga/z00533370/reliev3r_data/scannetpp
        split_ratio: 0.9
        max_distance: 8
        z_far: 40
        resolution:
          - [512, 336]
        frame_num: 8
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'

test_dataloader:
    drop_last: False
    shuffle: True
