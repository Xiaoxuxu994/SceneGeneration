# 贵阳 DST-obs 路径对照（来源：02_data_pipeline/Reliev3R_dataset2.xlsx「10.03数据v9-5迁移进度」）。
# 键 = v9-5 配置里的数据集名；src = efs 上的目录前缀（缓存 pkl 里存的绝对路径以它开头）；dst = 贵阳 OBS 目录。
# 生成 datamix_*_obs.yaml 时，data_root 保持 efs 路径不变（缓存文件名按 data_root 的哈希命名，这样已有缓存可直接复用），
# 再给每个数据集加 path_remap: {src: dst}，读取时自动改读 OBS。
# status: ok = 已就绪；unused = 暂不使用（生成 _obs 配置时从 weights 里去掉）。
# 缓存：所有数据集的索引缓存 pkl 都在 CACHE_DIR 下（文件名与 efs 上的缓存相同）。
CACHE_DIR: obs://bucket-471/z00533370/dataset/dataset_cache
ASE:             {status: ok,    src: /efs-m3ga/c50041401/datasets/reliev3r_synth_data/ASE,           dst: obs://bucket-471/y00959808/data/sr_datasets/processed/ASE}
Objaverse:       {status: unused,   src: /efs-m3ga/z00533370/reliev3r_data/objaverse_wai,                dst: obs://bucket-471/z00533370/dataset/objaverse_wai, note: "贵阳桶里的副本还没复制完，暂不使用；东四桶 bucket-mi-east4-sf 从贵阳访问不到（NoSuchBucket）"}
OmniObject3DNew: {status: ok,    src: /efs-m3ga/z00533370/reliev3r_data/Omniobject3d-New,             dst: obs://bucket-471/z00533370/dataset/Omniobject3d-New, note: "已解压；OBS 上 blender_renders_decode/<类别>/<类别>_NNN/，efs 是 blender_renders_decode/<类别>_NNN/，配置里用 re: 规则映射"}
