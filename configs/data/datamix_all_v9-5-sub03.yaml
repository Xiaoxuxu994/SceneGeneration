# @package _global_
# datamix_all_v9-5-sub03：= datamix_all_v9-5-sub02 加回 MegaDepth（train 900 / test 2000，与 v9-5 相同），
#   并让 MegaDepth、GTA-sfm 改读预处理数据（preproc_root），其余完全相同。24 个数据集。
# 预处理：run_sh_s3/run_dataset_sh/run_preprocess_md_gta.sh
#   MegaDepth -> obs://bucket-471/z00533370/dataset/MegaDepth_pre1024（长边 1024 的 jpg、float16 深度、预解析的 COLMAP 相机）
#   GTA-sfm   -> obs://bucket-471/z00533370/dataset/GTA-SfM_frames（整场景 h5 原样拆成逐帧文件）
#   **起训前预处理必须全部完成**（每个场景有 _DONE）；没做完的场景读不到会被当成读失败样本反复重试。
# 2026-11-09 用 tools/compare_preproc.py 对比（同 idx、同 seed，与原始读法逐帧比较）：
#   GTA-sfm   2 个样本 16 帧完全一致（位姿、K、深度、图像差都是 0）；单样本 2.9-6.4s -> 1.2-1.8s。
#   MegaDepth 3 个样本 24 帧：位姿差 <5e-7，K 相对差 <0.2%，深度相对误差中位数 <0.9%，PSNR 25-47 dB；
#             有效像素 IoU 0.94-1.00（缩图后深度空洞边缘差几个像素）；单样本 55-212s -> 1.3-2.0s。
#
# 以下为 sub02 的说明（仍然适用，MegaDepth、GTA-sfm 的读法除外）：
# datamix_all_v9-5-sub02：= datamix_all_v9-5-sub01 加回 Objaverse（train 9000 / test 2000，与 v9-5 相同），其余完全相同。
# Objaverse 贵阳 OBS（obs://bucket-471/z00533370/dataset/objaverse_wai）2026-11-09 核对：
#   缓存 Objaverse_3c340049_cache.pkl 里 140652 个物体，随机抽 300 个按缓存路径核对图像 + 深度，300/300 完整；
#   OBS 上另有约 1.3 万个只有 scene_meta.json、没有 images/depth 的目录，不在缓存里，训练不会抽到。
#   缓存 3.63 GB，单线程 mox.file.read 加载要 43 分钟；训练脚本会先拷到本地 /cache/dataset_cache。
# 相对 sub01 的另一处改动：train 的 Objaverse 打开 pct_disable（物体渲染数据，与 OmniObject3DNew、Replica 一致）。
# 数据迭代约定：每个数据版本一个独立的 yaml（sub00 / sub01 / sub02 …），实验脚本里写死 data=<版本>，不靠命令行覆盖。
#
# 以下为 sub01 的说明（仍然适用，Objaverse 除外）：
# datamix_all_v9-5-sub01：= datamix_all_v9-5-sub00 去掉 MegaDepth（train / test weights 都去掉），其余完全相同。
# 原因：MegaDepth 每样本从 OBS 读 172MB（原始分辨率 jpg + h5 深度 + COLMAP images.txt），训练时单样本等待 100-230s，
#       16 卡实测拖慢整步；去掉后 16 卡稳定约 2.5s/步。预处理（tools/preprocess_megadepth.py）完成后在后续 sub 版本加回。
# 数据迭代约定：每个数据版本一个独立的 yaml（sub00 / sub01 / …），实验脚本里写死 data=<版本>，不靠命令行覆盖。
#
# 相对 datamix_all_v9-5：
#   - 用到 22 个数据集：去掉 ARKitScenes、DL3DV、Objaverse（贵阳 OBS 上还没有 / 没复制完）、MegaDepth（太慢，待预处理）；
#     其余数据集参数与权重不变，train 权重合计 68500，test 合计 44000；
#   - ScanNet 用新路径 obs://bucket-471/z00533370/dataset/scannet_v2_decode；
#   - GTA-sfm 保持原始读法（整场景 hdf5），未用预处理数据；
#   - 打开过滤开关（说明见 datasets/FILTER_SWITCHES.md）：
#       pct_disable: true      不做 98 分位截断，只保留 z_far（合成 / 渲染类数据集）
#       pct_valid_only: true   98 分位只在有效像素上算（Matterport3D、ScanNet、Mapillary）
#       min_baseline_ratio: 0.05, baseline_retries: 3   视差不足时同一序列重新选帧（全部数据集）
#       use_dataset_masks: CO3DV2 已关闭（并入 depth_masks 后几乎每个样本都有空帧，见 tools/profile_data.py 结果）
#       pass_z_far: true       Habitat 的 z_far 真正生效
#     违例点、边缘飞点过滤还没有接入训练；
#   - 每个数据集加 path_remap（efs 前缀 -> 贵阳 OBS）与 cache_dir。data_root 仍是 efs 路径（缓存文件名按它的哈希命名）。
#   - MegaDepth、Objaverse 的配置块保留但不在 weights 里（不会被构造）；加回时只需在 weights 里加上权重。
# cache_dir 默认读 OBS 上的 dataset_cache；设了环境变量 DATASET_CACHE_DIR 时改读那里
#（训练脚本会先把 weights 里数据集的缓存拷到节点本地盘 /cache/dataset_cache，避免 8 个进程同时从 OBS 拉几 GB 的 pkl）。
