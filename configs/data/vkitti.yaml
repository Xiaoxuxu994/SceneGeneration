# @package _global_

train_dataset:
    length: 10000000         # dummy

    weights: 
        VirtualKitti: 1

    VirtualKitti:
        _target_: datasets.vkitti_dataset.VKittiDataset
        data_root: /efs-m3ga/c50041401/datasets/reliev3r_synth_data/vKitti2
        split_ratio: 0.9
        max_distance: 8
        z_far: 256
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights: 
        VirtualKitti: 1
    VirtualKitti:
        _target_: datasets.vkitti_dataset.VKittiDataset
        data_root: /efs-m3ga/c50041401/datasets/reliev3r_synth_data/vKitti2
        split_ratio: 0.9
        max_distance: 8
        z_far: 256
        frame_num: 8
        resolution:
            # - [518, 336]
            - [512, 336]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'

test_dataloader:
    drop_last: False
    shuffle: False
