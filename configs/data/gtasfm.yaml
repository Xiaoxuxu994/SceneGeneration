# @package _global_

train_dataset:
    length: 10000000         # dummy

    weights: 
        GTA-sfm: 1

    GTA-sfm:
        _target_: datasets.gta_sfm_dataset.GTASfMDataset
        data_root = "/mnt/nvme3/z00533370/dataset/sample_data/GTA-SfM"
        # data_root = "/efs-m3ga/h00548084/relive3r_raw/GTA-SfM/"
        split_ratio: 0.9
        max_distance: 8
        z_far: 200
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights: 
        GTA-sfm: 1
    GTA-sfm:
        _target_: datasets.gta_sfm_dataset.GTASfMDataset
        data_root = "/mnt/nvme3/z00533370/dataset/sample_data/GTA-SfM"
        # data_root = "/efs-m3ga/h00548084/relive3r_raw/GTA-SfM/"
        split_ratio: 0.9
        z_far: 200
        frame_num: 8
        resolution:
            # - [518, 336]
            - [512, 336]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'

test_dataloader:
    drop_last: False
    shuffle: False
