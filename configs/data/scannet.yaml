# @package _global_

train_dataset:
    length: 10000000         # dummy

    weights: 
        ScanNet: 1

    ScanNet:
        _target_: datasets.scannet_dataset.ScannetDataset
        data_root: /efs-m3ga/z00533370/dataset/scannet_v2_decode/
        invalid_list_path: data/scannet_invalid_list.json
        seq_num: -1
        verbose: true
        z_far: 80
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights: 
        ScanNet: 1
    ScanNet:
        _target_: datasets.scannet_dataset.ScannetDataset
        data_root: /efs-m3ga/z00533370/dataset/scannet_v2_decode/
        invalid_list_path: data/scannet_invalid_list.json
        seq_num: -1
        verbose: true
        z_far: 80
        frame_num: 8
        resolution:
            - [518, 336]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'

test_dataloader:
    drop_last: False
    shuffle: False
