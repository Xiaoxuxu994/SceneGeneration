# @package _global_
# datamix_all_v9-5_fix：v9-5 + 数据过滤修复开关（xiaoxu/Pi3_training_v2）。数据集、权重、路径与 v9-5 完全相同，只多了下列开关：
#   pct_disable: true      合成数据与物体类关掉 98 分位截断（质检规则评估：删掉的像素不比保留的脏，Lift < 1.5）
#   pct_valid_only: true   真实场景数据保留截断，但分位数只在有效像素上算
#   use_dataset_masks      DL3DV depth_mask、CO3DV2 depth_mask、ARKitScenes confidence==2 并入有效像素
#   DL3DV                  深度缩放改最近邻（depth_interp: nearest），分位只截一次（pct_twice: false）
#   Habitat                pass_z_far: true，配置里的 z_far: 80 真正生效
#   min_baseline_ratio     所有数据集要求所选帧 基线/深度 >= 0.05，不满足则重新选帧（最多 3 次）
# 训练侧另建议在 train 配置里加 worker_reseed: true（各 worker / 各卡使用不同随机数流）。
# 做对照时可以只打开其中一类开关。
