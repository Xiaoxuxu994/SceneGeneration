# @package _global_

train_dataset:
    length: 10000000         # dummy

    weights: 
        ASE: 1

    ASE:
        _target_: datasets.ase_dataset.ASEDataset
        # data_root: /mnt/nvme3/z00533370/dataset/sample_data/ASE
        data_root: /efs-m3ga/c50041401/datasets/reliev3r_synth_data/ASE
        split_ratio: 0.9
        z_far: 80
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights: 
        ASE: 1
    ASE:
        _target_: datasets.ase_dataset.ASEDataset
        # data_root: /mnt/nvme3/z00533370/dataset/sample_data/ASE
        data_root: /efs-m3ga/c50041401/datasets/reliev3r_synth_data/ASE
        split_ratio: 0.9
        z_far: 80
        frame_num: 8
        resolution:
            # - [518, 336]
            - [512, 336]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'

test_dataloader:
