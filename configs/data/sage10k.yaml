# @package _global_

train_dataset:
    length: 10000000         # dummy

    weights: 
        SAGE10K: 1

    SAGE10K:
        _target_: datasets.sage10k_dataset.SAGE10KDataset
        data_root: /efs-m3ga/h00548084/relive3r_raw/SAGE-10k/blend
        split_ratio: 0.9
        max_distance: 8
        z_far: 80
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights: 
        SAGE10K: 1
    SAGE10K:
        _target_: datasets.sage10k_dataset.SAGE10KDataset
        data_root: /efs-m3ga/h00548084/relive3r_raw/SAGE-10k/blend
        split_ratio: 0.9
        z_far: 80
        frame_num: 8
        resolution:
            # - [518, 336]
            - [512, 336]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'

test_dataloader:
    drop_last: False
    shuffle: False
