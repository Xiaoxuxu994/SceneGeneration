model:
  class_name: model.LVSM_scene_VGGT_decoder.Images2LatentScene

  image_tokenizer:
    image_size: 256
    patch_size: 8
    # in_channels: 9  # 3 RGB + 3 direction + 3 Reference

  target_pose_tokenizer:
    image_size: 256
    patch_size: 14
    in_channels: 6  # 3 direction + 3 Reference
  transformer:
    d: 768
    d_head: 64
    # encoder_n_layer: 12
    decoder_n_layer: 12
    special_init: true
    depth_init: true
    use_qk_norm: true
    # n_latent_vectors: 3072 # 3x32x32

training:
  amp_dtype: bf16
  # api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 4
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 5
  center_crop: true
  scene_scale_factor: 1.35
  checkpoint_dir: /storage/home/nargenziano/LVSM/checkpoints/LVSM_scene_VGGT_decoder/
  checkpoint_every: 2000
  dataset_name: data.dataset_scene_VGGT.Dataset
  dataset_path: /storage/datasets/nargenziano/re10k_LVSM/train/full_list.txt
  # features_path: /storage/datasets/nargenziano/re10k_LVSM/train/features
  features_path_save: /storage/datasets/nargenziano/re10k_LVSM/train/features

  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0
  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.5

  lr: 0.000025
  train_steps: 100000
  num_input_views: 2
  num_target_views: 6
  num_threads: 8
  num_views: 8
  num_workers: 4

  prefetch_factor: 32
  print_every: 10

  square_crop: true
  target_has_input: true
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 192
    min_frame_dist: 25
  vis_every: 1000
  
  mlfow_tracking_uri: file:/storage/home/nargenziano/mlruns
  mlflow_project: LVSM
  mlflow_exp_name: LVSM_scene_VGGT_decoder
  mlflow_log_every: 50

  warmup: 3000
  weight_decay: 0.05


# inference / evaluation
inference:
  if_inference: False
  compute_metrics: False
  view_idx_file_path: ./data/evaluation_index_re10k.json
  render_video: False
  render_video_config:
    traj_type: interpolate
    num_frames: 60
    loop_video: True 
    order_poses: False